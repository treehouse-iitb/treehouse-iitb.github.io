<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: site.title }}</title>

    <meta name="description" content="{{ page.description | default: site.description }}">
    <meta name="keywords" content="{{ page.keywords | default: site.keywords | default: 'Jaideep Joshi, IIT Bombay, Treehouse IITB, climate resilience, forest ecology' }}">
    <meta name="robots" content="index, follow">

    <meta property="og:title" content="{{ page.og_title | default: page.title | default: site.title }}">
    <meta property="og:description" content="{{ page.og_description | default: page.description | default: site.description }}">
    <meta property="og:url" content="{{ site.url }}{{ page.url | relative_url }}">
    <meta property="og:image" content="{{ site.url }}{{ page.og_image | default: '/images/logo_big.png' }}">
    <meta property="og:type" content="{{ page.og_type | default: 'website' }}">
    <meta name="twitter:card" content="summary_large_image">

    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
    <meta name="twitter:title" content="{{ page.title | default: site.title }}">
    <meta name="twitter:description" content="{{ page.description | default: site.description }}">
    <meta name="twitter:image" content="{{ site.url }}{{ page.og_image | default: '/images/logo_big.png' }}">
    <link rel="canonical" href="{{ site.url }}{{ page.url | relative_url }}">

    <!-- Meta tags -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>

<body>

{% include header.html %}

{{ content }}

{% include footer.html %}

<script>
function myFunction() {
    document.getElementById("myTopnav").classList.toggle("responsive");
}

function scrollToSection(sectionId) {
    document.getElementById(sectionId).scrollIntoView({ behavior: 'smooth' });
}

const parallaxElements = document.querySelectorAll('.parallax');

// Track which elements are visible
const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
        entry.target.isVisible = entry.isIntersecting;
    });
}, { threshold: 0.1 });

parallaxElements.forEach(el => observer.observe(el));

window.addEventListener('scroll', () => {
    const scrollTop = window.scrollY;

    parallaxElements.forEach(el => {
        if (!el.isVisible) return; // ✅ only animate when visible

        const speed = el.dataset.speed || 0.5;
        const offset = el.offsetTop;

        const yPos = (scrollTop - offset) * speed;
        el.style.backgroundPosition = `center ${yPos}px`;
    });
});

function filterPeople(event, role) {
    const cards = document.querySelectorAll('.person-card');
    const buttons = document.querySelectorAll('.filter-buttons button');

    buttons.forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');

    const filter = role.toLowerCase();

    cards.forEach(card => {

        // Always show PI
        if (card.classList.contains('pi-card')) {
            card.classList.remove('hidden');
            return;
        }

        const cardRole = card.dataset.role?.toLowerCase();

        if (filter === 'all' || cardRole === filter) {
            card.classList.remove('hidden');
        } else {
            card.classList.add('hidden');
        }
    });
}

</script>

</body>
</html>
