cosupervised_alumni:
  - name: Elisa Stefaniak
    role: postdoc
    image: /images/people/other/elisa_stefaniak.jpg
    title: Postdoc at IIASA, Austria
    bio: Elisa joined us as a postdoc in the RESIST project since 2022. Her main supervisor is Florian Hofhansl. She is coupling Plant-FATE with IIASA's CWATM model to understand the food-water-biodiversity nexus in the Bhima basin in India.
    links:
      globe: https://iiasa.ac.at/staff/elisa-stefaniak
      scholar: https://scholar.google.com/citations?user=h6qUu9QAAAAJ&hl=en

  - name: Tania Maxwell
    role: postdoc
    image: /images/people/other/tania_maxwell.jpg
    title: Postdoc at IIASA, Austria
    bio: Tania joined us as a postdoc in the RESIST project since 2022. Her main supervisor is Florian Hofhansl. She is exploring the coordination between fine-root traits.
    links:
      globe: https://iiasa.ac.at/staff/tania-maxwell
      scholar: https://scholar.google.ca/citations?user=BnCknmEAAAAJ&hl=en

