    title: Intern
    bio: Tina graduated from IIT Bombay in 2024 with a Bachelor of Technology in Engineering Physics. Her interests include all kinds of books, environmental sustainability and tennis. She's a prolific science communicator and runs her own YouTube channel on climate and sustainability.
