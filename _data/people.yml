cosupervised_current:
  - name: Atharva M Dhabab
    role: phd
    image: /images/people/other/atharva.jpeg
    title: PhD Student
    bio: Atharva is a doctoral researcher specializing in the intersection of hydrology, ecology, and climatology. Supervised by Prof. Subimal Ghosh and Prof. Jaideep Joshi, his research investigates the resilience of Himalayan grasslands by mapping causal relationships between vegetation, microclimate, and carbon fluxes. An alumnus of VNIT Nagpur and IIT Ropar, Atharva focuses on developing hybrid modeling frameworks that integrate process-based physical understanding with advanced AI/ML approaches. Beyond his research, he is an avid sportsman and musician.
    links:
      linkdin:  https://www.linkedin.com/in/atharva-m-dhabab-77816a320/
      email: 25d0296@iitb.ac.in
      twitter: https://x.com/AtharvaD17
      github: https://github.com/AMD-1234

  - name: Soumili Dutta
    role: phd
    image: /images/people/other/soumili.jpg
    title: PhD Student
    bio: Jointly supervised by Prof. Karthikeyan Lanka and Prof. Jaideep Joshi, Soumili’s research focuses on understanding how ecosystems respond during dry climate extremes. She is particularly interested in exploring vegetation dynamics under soil moisture stress and the how they adapt to environmental changes. When not immersed in research, she can be found sketching, binge-watching a good series, or getting lost in fiction, and believes that a good story can be found anywhere - from satellite images to the halls of Hogwarts.
    links:
      email: mailto:soumilidutta@iitb.ac.in
      linkedin: https://www.linkedin.com/in/soumili-dutta-676161186/
      scholar: https://scholar.google.com/citations?user=u_v78fcAAAAJ&hl=en


