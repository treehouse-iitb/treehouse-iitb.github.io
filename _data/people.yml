  - name: Elisa Stefaniak
    role: postdoc
    image: /images/people/other/elisa_stefaniak.jpg
    title: Postdoc at IIASA, Austria
    bio: Elisa joined us as a postdoc in the RESIST project since 2022. Her main supervisor is Florian Hofhansl. She is coupling Plant-FATE with IIASA's CWATM model to understand the food-water-biodiversity nexus in the Bhima basin in India.
